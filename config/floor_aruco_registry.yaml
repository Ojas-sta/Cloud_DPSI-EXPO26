# ==============================================================================
# Project Cloud: Concourse Optical Highway Floor ArUco Registry
# Spacing: 2.0m along main transit corridors
# Coordinate Frame: map (REP-103 right-handed, X=East, Y=North, Z=Up)
# Marker Family: cv2.aruco.DICT_4X4_50 or DICT_5X5_250 (IDs 100 to 123)
# Physical Mounting: Laminated matte-finish vinyl floor sticker flush at Z=0.001m
# ==============================================================================

floor_marker_family: "DICT_4X4_250"
marker_size_meters: 0.18 # 180mm x 180mm high-contrast matte square
min_spacing_meters: 2.0
reprojection_rmse_threshold_px: 2.0
min_contour_area_px: 900.0

markers:
  # --- South Entrance Foyer Corridor (Gate to Concourse) ---
  - tag_id: 100
    name: "FLOOR_SOUTH_GATE"
