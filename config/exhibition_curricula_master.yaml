  audio_file: p_01_narration.mp3
  evaluator: Divya
  speech: 'Welcome to Stall P-01: Stepwise AI. Guided by Divya, StepWise is an AI-assisted
    diabetic foot screening system designed to detect early warning signs of foot
    complications, particularly for people with reduced pain sensitivity. Using five
    cameras and AI-powered image analysis, the device identifies visible concerns
    such as ulcers, cracks, swelling, and discoloration. Its connected app provides
    screening reports, medical record storage, multilingual support, and emergency
    assistance. By combining accessible technology with preventive monitoring, StepWise
    aims to support early intervention, improve healthcare accessibility, and help
    prevent serious diabetic foot complications.'
  stall: P-01
  team_members:
  - Pulkit Chandra
  - Aryan Jindal
  title: Stepwise AI
