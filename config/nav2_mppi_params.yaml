# ==============================================================================
# Project Cloud: Nav2 MPPI & STVL 3D Costmap Production Configuration
# Platform: Unitree Go2 Edu Quadruped (Omnidirectional Planar Motion vx, vy, wz)
# Environment: 30m x 20m School Auditorium with 2.40m Aisles & Dynamic Student Crowds
# ==============================================================================

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.03
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.05

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 50
      model_dt: 0.05                 # 2.5s prediction horizon
      batch_size: 2000               # 2000 parallel trajectory rollouts
      vx_std: 0.20
      vy_std: 0.15
      wz_std: 0.35
      vx_max: 0.70                   # Nominal docent cruise speed
      vx_min: -0.25                  # Permit gentle backing up if crowded
      vy_max: 0.30                   # Lateral crab-walk allowance for crowd deflection
      wz_max: 1.00
      ax_max: 1.20
      ax_min: -1.80
      ay_max: 0.80
      az_max: 1.50
      iteration_count: 1
      prune_distance: 2.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"           # Exploits Go2 3-DOF planar locomotion (vx, vy, wz)
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic", "TwirlingCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.5             # Prevents unnatural sideways walking unless deflecting
        threshold_to_consider: 0.5
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0            # Suppresses spinning while omni-translating
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 15.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.04
      # Padded footprint for 0.65m x 0.35m Go2 chassis (+3cm safety margin)
      footprint: "[[0.355, 0.205], [0.355, -0.205], [-0.355, -0.205], [-0.355, 0.205]]"
      plugins: ["stvl_layer", "inflation_layer"]
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.2             # Clears walking students in 1.2s
        decay_model: 0               # Linear decay
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.04               # Captures low cones/cables above 4cm
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        observation_sources: l1_lidar_mark d435i_mark
        l1_lidar_mark:
          data_type: PointCloud2
          topic: /unilidar/cloud_deskewed
          marking: true
          clearing: true
          obstacle_range: 4.5
          min_obstacle_height: 0.05
          max_obstacle_height: 0.85  # Captures overhanging tables; ignores ceiling
          vertical_fov_angle: 1.57   # 90 deg vertical (-45 to +45)
          horizontal_fov_angle: 6.28 # 360 deg
          decay_acceleration: 5.0
          model_type: 1              # 3D Ray-frustum
        d435i_mark:
          data_type: PointCloud2
          topic: /camera/depth/color/points
          marking: true
          clearing: true
          obstacle_range: 3.0
          min_obstacle_height: 0.04
          max_obstacle_height: 0.85
          vertical_fov_angle: 0.99
          horizontal_fov_angle: 1.50
          decay_acceleration: 10.0
          model_type: 0              # Depth camera frustum
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5     # Smooth exponential decay for natural crowd clearance
        inflation_radius: 0.65       # Matches 0.65m E-stop boundary

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_safe"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.1
    source_timeout: 1.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "circle"
      radius: 0.65                   # Hard 0.65m E-Stop perimeter
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
    PolygonSlow:
      type: "polygon"
      points: "[[1.50, 0.45], [1.50, -0.45], [-0.40, -0.45], [-0.40, 0.45]]"
      action_type: "slowdown"
      min_points: 4
      slowdown_ratio: 0.30           # Scales 0.70 m/s down to ~0.21 m/s in tight spaces
      visualize: true
